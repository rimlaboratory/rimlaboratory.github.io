<div class="col-12 col-sm-6 col-lg-4 mb-5">
  <div class="text-center px-2" style="font-style: normal;">
    <img
      src="/assets/images/team/{{ member.image }}"
      style="width: 100%; max-width: 220px; aspect-ratio: 1 / 1; object-fit: cover; filter: grayscale(100%); border-radius: 50%;"
      alt="{{ member.title }}"
    >
    <h5 class="mt-3 mb-1" style="font-style: normal; font-size: 1.1rem; line-height: 1.3; white-space: nowrap; text-align: center;">
      <a href="{{ member.url }}" style="color: #006B6A; font-style: normal;">
        {{ member.title }}
      </a>
    </h5>
    <p style="font-size: 0.9rem; margin-bottom: 0; line-height: 1.4; text-align: center;">
      {{ member.role }}
    </p>
  </div>
</div>
