---
layout: default
---
<div class="container">

  <div class="text-center mt-5">

    <!-- Avatar -->
    <img src="/assets/images/team/{{ page.image }}"
         style="filter: grayscale(100%); width: 350px; height: 350px; object-fit: cover; border-radius: 50%; margin-bottom: 20px;"
         alt="{{ page.title }}" />

    <!-- Name & Role -->
    <h1 style="font-size: 1.75rem;">{{ page.title }}</h1>
    <h3 style="font-size: 1.25rem;">{{ page.role }}</h3>

    <!-- Email -->
    {% if page.email %}
    <p style="font-size: 1rem; margin-top: 10px; text-align: center;">
        <a href="mailto:{{ page.email }}" style="color: #555;">
            {{ page.email }}
        </a>
    </p>
    {% endif %}

    <!-- Social -->
